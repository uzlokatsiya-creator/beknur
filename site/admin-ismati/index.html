<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin panel — Doktor Ismati</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf2fb;--ink:#0a1222;--mute:#6b7689;--line:#dde3ee;--blue:#2d6bff;--red:#d92d20}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter Tight",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 120px}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 14px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px;font-weight:600}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
textarea{min-height:70px;resize:vertical}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri small{display:block;font-size:11px;color:var(--mute);font-weight:700;margin-bottom:3px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.b{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer}
.b.p{background:var(--blue);border-color:var(--blue);color:#fff}
.b.d{color:var(--red)}
.b.sm{padding:6px 12px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gal img{width:100%;height:170px;object-fit:cover;border-radius:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -4px 20px rgba(0,0,0,.08);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
#st{font-weight:600}
.hide{display:none!important}
.login{max-width:380px;margin:14vh auto}
.hint{color:var(--mute);font-size:13px}
@media(max-width:640px){.tri{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card login" id="login">
    <h1>Admin panel</h1>
    <label>Parol</label><input type="password" id="pw" autocomplete="current-password">
    <div class="row"><button class="b p" id="go">Kirish</button></div>
    <p id="lerr" style="color:var(--red)"></p>
  </div>
  <div id="app" class="hide">
    <h1>Admin panel · <a href="/" target="_blank">saytni ochish ↗</a></h1>
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </div>
</div>
<div class="bar hide" id="bar"><button class="b p" id="save">💾 Saqlash</button><span id="st"></span><button class="b sm" id="out">Chiqish</button></div>

<script>
const LANGS=['uz','ru','en'],E=()=>({uz:'',ru:'',en:''});
const TABS={main:'Asosiy',photos:'Rasmlar',services:'Xizmatlar',prices:'Narxlar',more:'Raqamlar va bosqichlar',contacts:'Aloqa'};
const LBL={heroK:'Ism ustidagi yozuv',nameA:'Ism (1-qator)',nameB:'Familiya (2-qator)',lead:'Bosh matn',cta:'Asosiy tugma',tag:'Qisqa yozuv (logo ostida)',rpH:'Ko‘k panel sarlavhasi',rpP:'Ko‘k panel matni',hl1:'Yorliq 1',hl2:'Yorliq 2',hl3:'Yorliq 3',stH:'Shior matni',stP:'Shior ostidagi matn',svcH:'Xizmatlar sarlavhasi',svcP:'Xizmatlar matni',whyH:'“Nega aynan biz” sarlavhasi',abK:'“Shifokor haqida” yozuvi',abH:'To‘liq ism',abP:'Shifokor haqida matn',f1:'Afzallik 1',f2:'Afzallik 2',f3:'Afzallik 3',f1s:'Rasm yorlig‘i 1',f2s:'Rasm yorlig‘i 2',f3s:'Rasm yorlig‘i 3',prK:'Jarayon yozuvi',prH:'Jarayon sarlavhasi',prcK:'Narxlar yozuvi',prcH:'Narxlar sarlavhasi',prcU:'Narx birligi',prcN:'Narxlar izohi',galK:'Galereya yozuvi',galH:'Galereya sarlavhasi',galE:'Galereya bo‘sh bo‘lsa',clK:'Klinika yozuvi',clH:'Klinika sarlavhasi',clP:'Klinika matni',clE:'Klinika jihozlari',coH:'Aloqa sarlavhasi',coP:'Aloqa matni'};
const LONG=/lead|abP|clP|coP|stH|stP|svcP|rpP/;
let S=null,tab='main',token=sessionStorage.getItem('tk'),dirty=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
const st=t=>$('#st').textContent=t;
const mark=()=>{dirty=true;st('Saqlanmagan o‘zgarishlar bor')};

function tri(path,o,long){return `<div class="tri">${LANGS.map(l=>`<div><small>${l.toUpperCase()}</small>${long?`<textarea data-p="${path}" data-l="${l}">${esc(o?.[l])}</textarea>`:`<input data-p="${path}" data-l="${l}" value="${esc(o?.[l])}">`}</div>`).join('')}</div>`}
const del=p=>`<button class="b sm d" data-del="${p}">O‘chirish</button>`;
const up=(p,i)=>`<button class="b sm" data-mv="${p}:${i}:-1">↑</button><button class="b sm" data-mv="${p}:${i}:1">↓</button>`;

function render(){
 $('#tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="b ${k===tab?'on':''}" data-tab="${k}">${v}</button>`).join('');
 let h='';
 if(tab==='main') h=`<div class="card"><h2>Matnlar</h2><p class="hint">Har bir matn 3 tilda: UZ · RU · EN.</p>${Object.keys(S.t).map(k=>`<label>${LBL[k]||k}</label>${tri('t.'+k,S.t[k],LONG.test(k))}`).join('')}</div>`;
 if(tab==='photos') h=`<div class="card"><h2>Asosiy portret</h2><div class="thumbs">${S.photo?`<img src="${esc(S.photo)}">`:''}</div><label>Yangi rasm</label><input type="file" accept="image/*" data-up="photo"></div>
  <div class="card"><h2>Ikkinchi rasm (konsultatsiya)</h2><div class="thumbs">${S.aboutPhoto?`<img src="${esc(S.aboutPhoto)}">`:''}</div><label>Yangi rasm</label><input type="file" accept="image/*" data-up="aboutPhoto"></div>
  <div class="card"><h2>Galereya</h2><label>Rasm qo‘shish (bir nechtasini tanlash mumkin)</label><input type="file" accept="image/*" multiple data-up="gallery">
  <div class="gal" style="margin-top:14px">${S.gallery.map((g,i)=>`<div class="box"><img src="${esc(g.url)}"><label>Izoh</label>${tri('gallery.'+i+'.c',g.c)}<div class="row">${up('gallery',i)}${del('gallery.'+i)}</div></div>`).join('')}</div></div>`;
 if(tab==='services') h=`<div class="card"><h2>Xizmatlar (kartalar)</h2>${S.services.map((s,i)=>`<div class="box"><label>Nomi</label>${tri('services.'+i+'.t',s.t)}<label>Tavsif</label>${tri('services.'+i+'.d',s.d,1)}<div class="row">${up('services',i)}${del('services.'+i)}</div></div>`).join('')}<button class="b" data-add="services">+ Xizmat qo‘shish</button></div>`;
 if(tab==='prices') h=S.prices.map((p,i)=>`<div class="card"><label>Bo‘lim nomi</label>${tri('prices.'+i+'.cat',p.cat)}${p.items.map((x,j)=>`<div class="box"><label>Xizmat</label>${tri(`prices.${i}.items.${j}.t`,x.t)}<label>Narx (mln so‘m, masalan: 3–4 yoki 0,15)</label><input data-s="prices.${i}.items.${j}.p" value="${esc(x.p)}"><div class="row">${del(`prices.${i}.items.${j}`)}</div></div>`).join('')}<div class="row"><button class="b" data-add="prices.${i}.items">+ Xizmat</button>${up('prices',i)}${del('prices.'+i)}</div></div>`).join('')+`<div class="card"><button class="b p" data-add="prices">+ Yangi bo‘lim</button></div>`;
 if(tab==='more') h=`<div class="card"><h2>Raqamlar</h2><p class="hint">Masalan: 10+ (yillik tajriba), 1500+ (operatsiya). Raqam sahifada noldan sanab chiqadi.</p>${S.stats.map((s,i)=>`<div class="box"><label>Qiymat</label><input data-s="stats.${i}.v" value="${esc(s.v)}"><label>Yozuv</label>${tri('stats.'+i+'.l',s.l)}<div class="row">${up('stats',i)}${del('stats.'+i)}</div></div>`).join('')}<button class="b" data-add="stats">+ Raqam</button></div>
  <div class="card"><h2>Jarayon bosqichlari</h2>${S.steps.map((s,i)=>`<div class="box"><label>Nomi</label>${tri('steps.'+i+'.t',s.t)}<label>Tavsif</label>${tri('steps.'+i+'.d',s.d,1)}<div class="row">${up('steps',i)}${del('steps.'+i)}</div></div>`).join('')}<button class="b" data-add="steps">+ Bosqich</button></div>
  <div class="card"><h2>Klinika yo‘nalishlari</h2>${S.directions.map((x,i)=>`<div class="box">${tri('directions.'+i,x)}<div class="row">${del('directions.'+i)}</div></div>`).join('')}<button class="b" data-add="directions">+ Yo‘nalish</button></div>`;
 if(tab==='contacts'){const c=S.contacts;h=`<div class="card"><h2>Aloqa</h2>
  <label>Telefon</label><input data-s="contacts.phone" value="${esc(c.phone)}" placeholder="+998 90 123 45 67">
  <label>Telegram (havola yoki @username)</label><input data-s="contacts.telegram" value="${esc(c.telegram)}">
  <label>Instagram akkauntlar (vergul bilan)</label><input id="ig" value="${esc((S.insta||[]).join(', '))}">
  <label>Manzil</label>${tri('contacts.address',c.address)}<label>Ish vaqti</label>${tri('contacts.hours',c.hours)}</div>`}
 $('#panel').innerHTML=h;
}

const NEW={services:()=>({t:E(),d:E(),g:'con'}),stats:()=>({v:'',l:E()}),steps:()=>({t:E(),d:E()}),directions:E,prices:()=>({cat:E(),items:[]})};
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.p){get(el.dataset.p)[el.dataset.l]=el.value;mark()}
 else if(el.dataset.s){const k=el.dataset.s.split('.');get(k.slice(0,-1).join('.'))[k.at(-1)]=el.value;mark()}
 else if(el.id==='ig'){S.insta=el.value.split(',').map(s=>s.trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/\/.*$/,'')).filter(Boolean);mark()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;render();scrollTo(0,0);return}
 if(b.dataset.del){if(!confirm('O‘chirilsinmi?'))return;const k=b.dataset.del.split('.');get(k.slice(0,-1).join('.')).splice(+k.at(-1),1);mark();render()}
 if(b.dataset.add){const p=b.dataset.add;get(p).push(/items$/.test(p)?{t:E(),p:''}:NEW[p]());mark();render()}
 if(b.dataset.mv){const [p,i,d]=b.dataset.mv.split(':'),a=get(p),j=+i+ +d;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];mark();render()}}});
document.addEventListener('change',async e=>{const el=e.target;if(!el.dataset.up)return;const k=el.dataset.up;
 for(const f of el.files){st('Yuklanmoqda: '+f.name);try{const url=await upload(f);if(k==='gallery')S.gallery.push({url,c:E()});else S[k]=url;mark()}catch(err){st('Xato: '+err.message)}}
 render();st('Rasm yuklandi. Endi “Saqlash”ni bosing.')});

// Shrink big photos before upload (max 1800px, webp)
async function shrink(file){if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
 const img=await createImageBitmap(file);const k=Math.min(1,1800/Math.max(img.width,img.height));
 const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 return await new Promise(r=>c.toBlob(b=>r(b||file),'image/webp',.86))}
async function upload(f){const b=await shrink(f);const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':b.type||f.type},body:b});
 if(r.status===401){logout();throw new Error('qayta kiring')}const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j.url}

$('#save').onclick=async()=>{st('Saqlanmoqda…');
 const r=await fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(S)});
 if(r.status===401){st('Sessiya tugadi, qayta kiring');logout();return}
 if(r.ok){dirty=false;st('✅ Saqlandi — saytda ko‘rinadi')}else st('❌ Xato: '+((await r.json().catch(()=>({}))).error||r.status))};
function logout(){sessionStorage.removeItem('tk');token=null;location.reload()}
$('#out').onclick=logout;
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

async function start(){
 let r=await fetch('/api/content',{cache:'no-store'});
 S=r.ok?await r.json():await (await fetch('/content.default.json',{cache:'no-store'})).json();
 $('#login').classList.add('hide');$('#app').classList.remove('hide');$('#bar').classList.remove('hide');render()}
$('#go').onclick=async()=>{$('#lerr').textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
 const j=await r.json().catch(()=>({}));if(!r.ok){$('#lerr').textContent=r.status===401?'Parol noto‘g‘ri':(j.error||'Xato');return}
 token=j.token;sessionStorage.setItem('tk',token);start()};
$('#pw').onkeydown=e=>e.key==='Enter'&&$('#go').click();
if(token)start();
</script>
</body>
</html>
