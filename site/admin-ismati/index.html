<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin panel — Doktor Ismati</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5fd;--ink:#0a1222;--ink2:#3b4658;--mute:#7a8597;--line:#e3e9f3;--blue:#2d6bff;--blue2:#1b4fe6;--sky:#e7eeff;--red:#d92d20;--green:#0e9f6e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.hide{display:none!important}

/* ---------- login ---------- */
.lg{min-height:100svh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden;background:linear-gradient(150deg,#3a78ff,#1b4fe6 55%,#0d2fa8)}
.lg::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.14) 1px,transparent 0) 0 0/26px 26px}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,#c9dbff 9%,#5b8cff 35%,#1f57f0 62%,#0a2a9e);box-shadow:inset -10px -14px 30px rgba(0,10,80,.45);animation:fl 8s ease-in-out infinite}
.o1{width:220px;height:220px;right:-60px;top:-50px}.o2{width:90px;height:90px;left:8%;bottom:12%;animation-delay:-3s}.o3{width:46px;height:46px;left:22%;top:16%;animation-delay:-5s}
@keyframes fl{50%{transform:translateY(-16px) rotate(8deg)}}
.lcard{position:relative;width:min(420px,100%);background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-radius:28px;padding:34px 30px 28px;box-shadow:0 40px 80px rgba(5,20,80,.35);animation:up .8s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(30px) scale(.97)}}
.lav{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:4px solid #fff;box-shadow:0 10px 30px rgba(45,107,255,.35);margin:-72px auto 14px;display:block;background:var(--sky)}
.lcard h1{text-align:center;font-size:26px;letter-spacing:-.03em;margin:0}
.lcard .sub{text-align:center;color:var(--mute);margin:4px 0 24px;font-size:14px}
.fld{position:relative}
.fld svg.l{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--mute)}
.fld input{width:100%;padding:15px 50px 15px 46px;border:1.5px solid var(--line);border-radius:16px;font:inherit;font-size:16px;background:var(--bg);outline:none;transition:border-color .25s,background .25s,box-shadow .25s}
.fld input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(45,107,255,.14)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:12px;background:none;cursor:pointer;color:var(--mute);display:grid;place-items:center}
.eye:hover{background:var(--sky);color:var(--blue)}.eye svg{width:20px;height:20px}
.go{width:100%;margin-top:14px;padding:15px;border:0;border-radius:16px;background:var(--blue);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .25s,transform .25s,box-shadow .25s}
.go:hover{background:var(--blue2);box-shadow:0 14px 30px rgba(45,107,255,.35);transform:translateY(-1px)}
.go.ld{pointer-events:none;opacity:.8}.go.ld::after{content:"";width:16px;height:16px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lerr{min-height:22px;margin:12px 0 0;text-align:center;color:var(--red);font-weight:600;font-size:14px}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:10px}

/* ---------- app layout ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100svh}
.side{position:sticky;top:0;height:100svh;background:#0b1630;color:#c9d3e6;padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 15%;border:2px solid var(--blue)}
.brand b{display:block;color:#fff;font-size:15px}.brand small{font-size:12px;color:#8494b3}
.tabs{display:flex;flex-direction:column;gap:4px}
.tabs button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border:0;border-radius:12px;background:none;color:#c9d3e6;font:inherit;font-weight:500;cursor:pointer;transition:background .2s,color .2s}
.tabs button svg{width:19px;height:19px;flex:none;opacity:.85}
.tabs button:hover{background:rgba(255,255,255,.06);color:#fff}
.tabs button.on{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(45,107,255,.35)}
.side .sp{flex:1}
.side a.sl,.side button.sl{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;color:#c9d3e6;text-decoration:none;font-size:14px;background:none;border:0;font:inherit;cursor:pointer}
.side .sl:hover{background:rgba(255,255,255,.06);color:#fff}
.main{padding:28px clamp(16px,3vw,40px) 120px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.03em;margin:0}
.top p{margin:2px 0 0;color:var(--mute);font-size:14px}
.card{background:#fff;border-radius:22px;padding:clamp(16px,2.4vw,26px);margin-bottom:16px;box-shadow:0 1px 2px rgba(10,30,80,.04),0 8px 24px rgba(10,30,80,.04)}
h2{font-size:18px;margin:0 0 6px;letter-spacing:-.02em}
label{display:block;font-size:12px;color:var(--mute);margin:14px 0 5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
input,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fbfcff;color:var(--ink);transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(45,107,255,.12)}
input[type=file]{padding:18px;border-style:dashed;background:var(--sky);cursor:pointer;color:var(--ink2)}
textarea{min-height:80px;resize:vertical}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri small{display:inline-block;font-size:10.5px;font-weight:700;margin-bottom:4px;padding:2px 7px;border-radius:6px;background:var(--sky);color:var(--blue)}
.box{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0;background:#fcfdff;transition:border-color .2s}
.box:hover{border-color:#c9d6ee}
.b{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.b:hover{border-color:var(--blue);color:var(--blue)}
.b.p{background:var(--blue);border-color:var(--blue);color:#fff}.b.p:hover{background:var(--blue2);color:#fff}
.b.d{color:var(--red)}.b.d:hover{border-color:var(--red);background:#fff5f4}
.b.sm{padding:6px 12px;font-size:13px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs img{width:140px;height:140px;object-fit:cover;border-radius:16px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gal img{width:100%;height:180px;object-fit:cover;border-radius:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hint{color:var(--mute);font-size:13.5px;margin:0 0 6px}
.bar{position:fixed;right:20px;bottom:20px;z-index:20;background:#0b1630;color:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 50px rgba(5,20,60,.35)}
#st{font-weight:600;font-size:14px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .b.p{padding:11px 22px}
.bar.dirty #st{color:#ffd166}
.toast{animation:up .4s}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:10;flex-direction:row;align-items:center;padding:10px;gap:8px;overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .brand{padding:0 6px 0 0}.brand span{display:none}
  .tabs{flex-direction:row}.tabs button{white-space:nowrap;padding:9px 12px}
  .side .sp,.side .sl span{display:none}
  .bar{left:12px;right:12px;bottom:12px;justify-content:space-between}
  .tri{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="lg" id="login">
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
  <div class="lcard" id="lcard">
    <img class="lav" src="/assets/4.webp" alt="">
    <h1>Admin panel</h1>
    <p class="sub">Doktor Ismati sayti boshqaruvi</p>
    <div class="fld">
      <svg class="l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
      <input type="password" id="pw" placeholder="Parolni kiriting" autocomplete="current-password" autofocus>
      <button class="eye" id="eye" type="button" aria-label="Parolni ko‘rsatish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button class="go" id="go">Kirish</button>
    <p class="lerr" id="lerr"></p>
    <p class="foot">Faqat sayt egasi uchun</p>
  </div>
</div>

<div class="app hide" id="app">
  <aside class="side">
    <div class="brand"><img src="/assets/4.webp" alt=""><span><b>Doktor Ismati</b><small>Admin panel</small></span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="sp"></div>
    <a class="sl" href="/" target="_blank"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1h5"/></svg><span>Saytni ochish</span></a>
    <button class="sl" id="out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg><span>Chiqish</span></button>
  </aside>
  <main class="main">
    <div class="top"><div><h1 id="ttl"></h1><p id="tsub"></p></div></div>
    <div id="panel"></div>
  </main>
</div>
<div class="bar hide" id="bar"><span id="st">O‘zgarishlar saqlangan</span><button class="b p" id="save">Saqlash</button></div>

<script>
const LANGS=['uz','ru','en'],E=()=>({uz:'',ru:'',en:''});
const TABS={main:'Asosiy',photos:'Rasmlar',services:'Xizmatlar',prices:'Narxlar',more:'Raqamlar va bosqichlar',edu:'Ta’lim va sharhlar',contacts:'Aloqa'};
const LBL={heroK:'Ism ustidagi yozuv',nameA:'Ism (1-qator)',nameB:'Familiya (2-qator)',lead:'Bosh matn',cta:'Asosiy tugma',tag:'Qisqa yozuv (logo ostida)',rpH:'Ko‘k panel sarlavhasi',rpP:'Ko‘k panel matni',hl1:'Yorliq 1',hl2:'Yorliq 2',hl3:'Yorliq 3',stH:'Shior matni',stP:'Shior ostidagi matn',svcH:'Xizmatlar sarlavhasi',svcP:'Xizmatlar matni',whyH:'“Nega aynan biz” sarlavhasi',abK:'“Shifokor haqida” yozuvi',abH:'To‘liq ism',abP:'Shifokor haqida matn',f1:'Afzallik 1',f2:'Afzallik 2',f3:'Afzallik 3',f1s:'Rasm yorlig‘i 1',f2s:'Rasm yorlig‘i 2',f3s:'Rasm yorlig‘i 3',prK:'Jarayon yozuvi',prH:'Jarayon sarlavhasi',prcK:'Narxlar yozuvi',prcH:'Narxlar sarlavhasi',prcU:'Narx birligi',prcN:'Narxlar izohi',galK:'Galereya yozuvi',galH:'Galereya sarlavhasi',galE:'Galereya bo‘sh bo‘lsa',clK:'Klinika yozuvi',clH:'Klinika sarlavhasi',clP:'Klinika matni',clE:'Klinika jihozlari',coH:'Aloqa sarlavhasi',coP:'Aloqa matni'};
const LONG=/lead|abP|clP|coP|stH|stP|svcP|rpP/;
let S=null,tab='main',token=sessionStorage.getItem('tk'),dirty=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
const st=t=>$('#st').textContent=t;
const mark=()=>{dirty=true;$('#bar').classList.add('dirty');st('● Saqlanmagan o‘zgarishlar')};
const TI={main:'<path d="M4 6h16M4 12h16M4 18h10"/>',photos:'<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/>',services:'<path d="M12 3c-4 0-6 3.5-6 8 0 5 3 9 6 9s6-4 6-9c0-4.5-2-8-6-8z"/>',prices:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',more:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',edu:'<path d="M12 4l10 5-10 5L2 9z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>',contacts:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/>'};
const TS={main:'Saytdagi barcha matnlar — 3 tilda',photos:'Portret, konsultatsiya rasmi va galereya',services:'Bosh sahifadagi xizmat kartalari',prices:'Narxlar katalogi va bo‘limlar',more:'Raqamlar, jarayon bosqichlari, klinika yo‘nalishlari',edu:'Ta’lim tarixi va clinics.uz sharhlari',contacts:'Telefon, Telegram, Instagram, manzil'};

function tri(path,o,long){return `<div class="tri">${LANGS.map(l=>`<div><small>${l.toUpperCase()}</small>${long?`<textarea data-p="${path}" data-l="${l}">${esc(o?.[l])}</textarea>`:`<input data-p="${path}" data-l="${l}" value="${esc(o?.[l])}">`}</div>`).join('')}</div>`}
const del=p=>`<button class="b sm d" data-del="${p}">O‘chirish</button>`;
const up=(p,i)=>`<button class="b sm" data-mv="${p}:${i}:-1">↑</button><button class="b sm" data-mv="${p}:${i}:1">↓</button>`;

function render(){
 $('#tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k===tab?'on':''}" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">${TI[k]}</svg>${v}</button>`).join('');
 $('#ttl').textContent=TABS[tab];$('#tsub').textContent=TS[tab];
 let h='';
 if(tab==='main') h=`<div class="card"><h2>Matnlar</h2><p class="hint">Har bir matn 3 tilda: UZ · RU · EN.</p>${Object.keys(S.t).map(k=>`<label>${LBL[k]||k}</label>${tri('t.'+k,S.t[k],LONG.test(k))}`).join('')}</div>`;
 if(tab==='photos') h=`<div class="card"><h2>Asosiy portret</h2><div class="thumbs">${S.photo?`<img src="${esc(S.photo)}">`:''}</div><label>Yangi rasm</label><input type="file" accept="image/*" data-up="photo"></div>
  <div class="card"><h2>Ikkinchi rasm (konsultatsiya)</h2><div class="thumbs">${S.aboutPhoto?`<img src="${esc(S.aboutPhoto)}">`:''}</div><label>Yangi rasm</label><input type="file" accept="image/*" data-up="aboutPhoto"></div>
  <div class="card"><h2>Galereya</h2><label>Rasm qo‘shish (bir nechtasini tanlash mumkin)</label><input type="file" accept="image/*" multiple data-up="gallery">
  <div class="gal" style="margin-top:14px">${S.gallery.map((g,i)=>`<div class="box"><img src="${esc(g.url)}"><label>Izoh</label>${tri('gallery.'+i+'.c',g.c)}<div class="row">${up('gallery',i)}${del('gallery.'+i)}</div></div>`).join('')}</div></div>`;
 if(tab==='services') h=`<div class="card"><h2>Xizmatlar (kartalar)</h2>${S.services.map((s,i)=>`<div class="box"><label>Nomi</label>${tri('services.'+i+'.t',s.t)}<label>Tavsif</label>${tri('services.'+i+'.d',s.d,1)}<div class="row">${up('services',i)}${del('services.'+i)}</div></div>`).join('')}<button class="b" data-add="services">+ Xizmat qo‘shish</button></div>`;
 if(tab==='prices') h=S.prices.map((p,i)=>`<div class="card"><label>Bo‘lim nomi</label>${tri('prices.'+i+'.cat',p.cat)}${p.items.map((x,j)=>`<div class="box"><label>Xizmat</label>${tri(`prices.${i}.items.${j}.t`,x.t)}<label>Narx (mln so‘m, masalan: 3–4 yoki 0,15)</label><input data-s="prices.${i}.items.${j}.p" value="${esc(x.p)}"><div class="row">${del(`prices.${i}.items.${j}`)}</div></div>`).join('')}<div class="row"><button class="b" data-add="prices.${i}.items">+ Xizmat</button>${up('prices',i)}${del('prices.'+i)}</div></div>`).join('')+`<div class="card"><button class="b p" data-add="prices">+ Yangi bo‘lim</button></div>`;
 if(tab==='more') h=`<div class="card"><h2>Raqamlar</h2><p class="hint">Masalan: 10+ (yillik tajriba), 1500+ (operatsiya). Raqam sahifada noldan sanab chiqadi.</p>${S.stats.map((s,i)=>`<div class="box"><label>Qiymat</label><input data-s="stats.${i}.v" value="${esc(s.v)}"><label>Yozuv</label>${tri('stats.'+i+'.l',s.l)}<div class="row">${up('stats',i)}${del('stats.'+i)}</div></div>`).join('')}<button class="b" data-add="stats">+ Raqam</button></div>
  <div class="card"><h2>Jarayon bosqichlari</h2>${S.steps.map((s,i)=>`<div class="box"><label>Nomi</label>${tri('steps.'+i+'.t',s.t)}<label>Tavsif</label>${tri('steps.'+i+'.d',s.d,1)}<div class="row">${up('steps',i)}${del('steps.'+i)}</div></div>`).join('')}<button class="b" data-add="steps">+ Bosqich</button></div>
  <div class="card"><h2>Klinika yo‘nalishlari</h2>${S.directions.map((x,i)=>`<div class="box">${tri('directions.'+i,x)}<div class="row">${del('directions.'+i)}</div></div>`).join('')}<button class="b" data-add="directions">+ Yo‘nalish</button></div>`;
 if(tab==='edu'){S.edu=S.edu||[];S.reviews=S.reviews||{count:'',url:''};h=`<div class="card"><h2>Ta’lim (vaqt chizig‘i)</h2>${S.edu.map((e,i)=>`<div class="box"><label>Yil</label><input data-s="edu.${i}.y" value="${esc(e.y)}"><label>Nomi</label>${tri('edu.'+i+'.t',e.t)}<label>Joyi</label>${tri('edu.'+i+'.d',e.d)}<div class="row">${up('edu',i)}${del('edu.'+i)}</div></div>`).join('')}<button class="b" data-add="edu">+ Qo‘shish</button></div>
  <div class="card"><h2>Sharhlar (clinics.uz)</h2><label>Sharhlar soni</label><input data-s="reviews.count" value="${esc(S.reviews.count)}"><label>Sharhlar sahifasi havolasi</label><input data-s="reviews.url" value="${esc(S.reviews.url)}"></div>`}
 if(tab==='contacts'){const c=S.contacts;h=`<div class="card"><h2>Aloqa</h2>
  <label>Telefon</label><input data-s="contacts.phone" value="${esc(c.phone)}" placeholder="+998 90 123 45 67">
  <label>Telefon 2</label><input data-s="contacts.phone2" value="${esc(c.phone2)}">
  <label>Telegram (havola yoki @username)</label><input data-s="contacts.telegram" value="${esc(c.telegram)}">
  <label>Instagram akkauntlar (vergul bilan)</label><input id="ig" value="${esc((S.insta||[]).join(', '))}">
  <label>Manzil</label>${tri('contacts.address',c.address)}<label>Ish vaqti</label>${tri('contacts.hours',c.hours)}</div>`}
 $('#panel').innerHTML=h;
}

const NEW={services:()=>({t:E(),d:E(),g:'con'}),stats:()=>({v:'',l:E()}),steps:()=>({t:E(),d:E()}),directions:E,prices:()=>({cat:E(),items:[]}),edu:()=>({y:'',t:E(),d:E()})};
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.p){get(el.dataset.p)[el.dataset.l]=el.value;mark()}
 else if(el.dataset.s){const k=el.dataset.s.split('.');get(k.slice(0,-1).join('.'))[k.at(-1)]=el.value;mark()}
 else if(el.id==='ig'){S.insta=el.value.split(',').map(s=>s.trim().replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/\/.*$/,'')).filter(Boolean);mark()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;render();scrollTo(0,0);return}
 if(b.dataset.del){if(!confirm('O‘chirilsinmi?'))return;const k=b.dataset.del.split('.');get(k.slice(0,-1).join('.')).splice(+k.at(-1),1);mark();render()}
 if(b.dataset.add){const p=b.dataset.add;get(p).push(/items$/.test(p)?{t:E(),p:''}:NEW[p]());mark();render()}
 if(b.dataset.mv){const [p,i,d]=b.dataset.mv.split(':'),a=get(p),j=+i+ +d;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];mark();render()}}});
document.addEventListener('change',async e=>{const el=e.target;if(!el.dataset.up)return;const k=el.dataset.up;
 for(const f of el.files){st('Yuklanmoqda: '+f.name);try{const url=await upload(f);if(k==='gallery')S.gallery.push({url,c:E()});else S[k]=url;mark()}catch(err){st('Xato: '+err.message)}}
 render();st('Rasm yuklandi. Endi “Saqlash”ni bosing.')});

// Shrink big photos before upload (max 1800px, webp)
async function shrink(file){if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
 const img=await createImageBitmap(file);const k=Math.min(1,1800/Math.max(img.width,img.height));
 const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 return await new Promise(r=>c.toBlob(b=>r(b||file),'image/webp',.86))}
async function upload(f){const b=await shrink(f);const r=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':b.type||f.type},body:b});
 if(r.status===401){logout();throw new Error('qayta kiring')}const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j.url}

$('#save').onclick=async()=>{st('Saqlanmoqda…');
 const r=await fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(S)});
 if(r.status===401){st('Sessiya tugadi, qayta kiring');logout();return}
 if(r.ok){dirty=false;$('#bar').classList.remove('dirty');st('✓ Saqlandi — saytda ko‘rinadi')}else st('❌ Xato: '+((await r.json().catch(()=>({}))).error||r.status))};
function logout(){sessionStorage.removeItem('tk');token=null;location.reload()}
$('#out').onclick=logout;
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

async function start(){
 let r=await fetch('/api/content',{cache:'no-store'});
 S=r.ok?await r.json():await (await fetch('/content.default.json',{cache:'no-store'})).json();
 $('#login').classList.add('hide');$('#app').classList.remove('hide');$('#bar').classList.remove('hide');render()}
$('#eye').onclick=()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password';p.focus()};
$('#go').onclick=async()=>{const g=$('#go'),c=$('#lcard');$('#lerr').textContent='';if(!$('#pw').value){$('#lerr').textContent='Parolni kiriting';return}
 g.classList.add('ld');g.textContent='Tekshirilmoqda';let r,j={};
 try{r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});j=await r.json().catch(()=>({}))}catch(_){r={ok:false,status:0}}
 g.classList.remove('ld');g.textContent='Kirish';
 if(!r.ok){$('#lerr').textContent=r.status===401?'Parol noto‘g‘ri':(j.error||'Server bilan aloqa yo‘q');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');return}
 token=j.token;sessionStorage.setItem('tk',token);start()};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
if(token)start();
</script>
